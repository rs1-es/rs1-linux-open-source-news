service: news-rs1-es

frameworkVersion: '3'

custom:
  bucketName: news.rs1.es

provider:
  name: aws
  runtime: python3.12
  stage: prod
  region: eu-west-1
  tags:
    project: ${self:service}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - 's3:GetObject'
            - 's3:PutObject'
            - 's3:DeleteObject'
          Resource: arn:aws:s3:::${self:custom.bucketName}/*
functions:
  main:
    image: <ACCOUNT_ID>.dkr.ecr.eu-west-1.amazonaws.com/news-rs1-es@sha256:0132948806c46849a905fe3c93ba8d5f506b1578a148fb372966ef976d72a1f0
    memorySize: 512
    timeout: 180
