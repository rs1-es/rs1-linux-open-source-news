service: news-rs1-es

frameworkVersion: '3'

custom:
  bucketName: news.rs1.es

provider:
  name: aws
  runtime: python3.9
  stage: prod
  region: eu-west-1
  tags:
    project: ${self:service}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - 's3:GetObject'
            - 's3:PutObject'
            - 's3:DeleteObject'
          Resource: arn:aws:s3:::${self:custom.bucketName}/*
functions:
  main:
    image: <ACCOUNT_ID>.dkr.ecr.eu-west-1.amazonaws.com/news-rs1-es@sha256:a9e52f406b81f47abc43ab0a71dbc5422d5dc36df8c9de5aa83b6726254b1074
    memorySize: 512
    timeout: 180
